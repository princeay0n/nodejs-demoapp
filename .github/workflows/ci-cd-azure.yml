
name: MongoTask Azure CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "build/**"
      - "helm/mongotask/**"
      - ".github/workflows/ci-cd-azure.yml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: mongotask-dev-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      ACR_NAME: testprinceacr1416653497
      ACR_LOGIN_SERVER: testprinceacr1416653497.azurecr.io
      IMAGE_NAME: nodejs-demoapp
      AKS_RESOURCE_GROUP: prince.saha-RG
      AKS_CLUSTER: test-prince-aks-dev
      K8S_NAMESPACE: mongotask-dev
      HELM_RELEASE: mongotask

    steps:
      - name: Checkout application
        uses: actions/checkout@v4

      - name: Azure login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Azure Container Registry
        shell: bash
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:$GITHUB_SHA"

          docker build \
            -f build/Dockerfile \
            -t "$IMAGE" \
            .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Connect to demo AKS cluster
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/mongotask"
          echo "KUBECONFIG=$RUNNER_TEMP/mongotask/kubeconfig" >> "$GITHUB_ENV"

          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --file "$RUNNER_TEMP/mongotask/kubeconfig" \
            --overwrite-existing

      - name: Validate Helm chart
        run: |
          helm lint ./helm/mongotask

      - name: Deploy image to AKS
        shell: bash
        run: |
          set -euo pipefail

          helm upgrade --install "$HELM_RELEASE" \
            ./helm/mongotask \
            --namespace "$K8S_NAMESPACE" \
            --kube-context "$AKS_CLUSTER" \
            --set-string image.tag="$GITHUB_SHA" \
            --wait \
            --timeout 10m

      - name: Verify Kubernetes rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl --context "$AKS_CLUSTER" \
            -n "$K8S_NAMESPACE" \
            rollout status deployment/mongotask \
            --timeout=300s

          kubectl --context "$AKS_CLUSTER" \
            -n "$K8S_NAMESPACE" \
            get pods

      - name: Verify public website
        shell: bash
        run: |
          set -euo pipefail

          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 20 \
            http://20.235.110.28/
